[package]
name = "esp-xy-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[[bin]]
name = "esp-xy-client"
path = "src/main.rs"

[dependencies]
resp = { path = "../resp" }

btleplug = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
futures = "0.3"
thiserror = "2.0"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
